#Sección para describir la visión de transferencia de la agrupación.

title: Transferencia
meta_description: Descripción de la visión de transferencia de ComSCIAM
heading: Transferencia
intro: |
   ComSCIAM aspira a convertirse en un centro de referencia en el sur de Europa dentro de sus áreas de conocimiento. Por ello, una parte fundamental de su actividad es la colaboración con las empresas e instituciones del territorio, con el objetivo de poner el conocimiento y la investigación al servicio de sus necesidades . En este sentido, ComSCIAM propone un modelo de transferencia basado en la formación y en la resolución de los problemas y retos que puedan plantear estos actores.
how_heading: ¿Cómo hacemos transferencia?
how_text: De diferentes maneras
