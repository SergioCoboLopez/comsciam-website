#Section to describe the knowledge transfer vision of the research unit

title: Knowledge transfer
meta_description: Description of ComSCIAM's vision on knowledge transfer
heading: Knowledge transfer
intro: |
       ComSCIAM aims to become a reference center in southern Europe in its areas of expertise. To this end, a key part of its activities is collaboration with businesses and institutions, with the goal of applying its knowledge and research to meet their needs. ComSCIAM proposes a knowledge-transfer model based on training and on addressing the specific problems and challenges that these stakeholders may raise.
