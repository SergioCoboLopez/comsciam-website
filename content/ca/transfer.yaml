#Secció per descriure la visió de transferència de l'agrupació

title: Tranferència
meta_description: secció per descriure la visió de transferència del ComSCIAM
heading: Transferència
intro: |
   El ComSCIAM vol esdevenir un centre de referència al sud d’Europa en les seves àrees de coneixement. Per això, una part fundamental de la seva activitat és la col·laboració amb les empreses i institucions amb l'objectiu de posar el coneixement i la recerca al servei de les seves necessitats. El ComSCIAM proposa un model de transferència basat en la formació i la resolució dels problemes i reptes que puguin plantejar aquests actors.

how_heading: Com fem transferència?
how_text: |
   De diverses maneres.
